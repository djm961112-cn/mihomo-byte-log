name: Build macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build universal app
        run: bash build.sh
      - name: Verify package and generate checksum
        run: |
          xcrun lipo 'dist/Mihomo Byte Log.app/Contents/MacOS/ClashTraffic' -verify_arch arm64 x86_64
          cd dist
          unzip -tq Mihomo-Byte-Log-macOS.zip
          shasum -a 256 Mihomo-Byte-Log-macOS.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "Mihomo Byte Log $TAG" \
            --notes 'macOS 13+ 通用版（Apple 芯片和 Intel）。下载 ZIP 后解压并打开 App。安装、兼容性和首次打开说明见仓库 README。' \
            dist/Mihomo-Byte-Log-macOS.zip dist/SHA256SUMS.txt
